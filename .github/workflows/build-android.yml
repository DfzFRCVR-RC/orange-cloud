name: Android OSS 构建

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21 (JetBrains)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "jetbrains"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: 写入 local.properties（OAuth 客户端）
        working-directory: apps/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "OAUTH_CLIENT_ID=e835bf30a41b35df00333e74f35a6439" >> local.properties
          echo "OAUTH_CLIENT_ID 已注入:"
          grep OAUTH_CLIENT_ID local.properties

      - name: 构建 OSS 包
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOssDebug --no-daemon

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-oss-debug
          path: apps/android/app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: warn