name: Android OSS Release (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "jetbrains"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: Write local.properties (OAuth client)
        working-directory: apps/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "OAUTH_CLIENT_ID=e835bf30a41b35df00333e74f35a6439" >> local.properties
          echo "OAUTH_CLIENT_ID injected:"
          grep OAUTH_CLIENT_ID local.properties

      - name: Patch OAuthConfig redirect URI
        working-directory: apps/android
        run: |
          sed -i 's|const val REDIRECT_URI = "https://o-c.do/oauth/callback"|const val REDIRECT_URI = "https://oatuh.miside.ccwu.cc/oauth/callback"|' \
            app/src/main/kotlin/jiamin/chen/orangecloud/core/auth/OAuthConfig.kt
          echo "=== Patched REDIRECT_URI ==="
          grep REDIRECT_URI app/src/main/kotlin/jiamin/chen/orangecloud/core/auth/OAuthConfig.kt

      - name: Build OSS release (unsigned)
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOssRelease --no-daemon

      - name: List all APK artifacts
        if: always()
        working-directory: apps/android
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-oss-release-unsigned
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error