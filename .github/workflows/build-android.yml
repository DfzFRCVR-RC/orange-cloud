name: Android OSS 构建

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: "OAUTH_CLIENT_ID（注入 local.properties）"
        required: false
        default: "e835bf30a41b35df00333e74f35a6439"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: 写入 local.properties（OAuth 客户端）
        run: |
          OAUTH_ID="${{ github.event.inputs.oauth_client_id }}"
          if [ -z "$OAUTH_ID" ]; then OAUTH_ID="${{ secrets.OAUTH_CLIENT_ID }}"; fi
          [ -n "$OAUTH_ID" ] && echo "OAUTH_CLIENT_ID=$OAUTH_ID" > local.properties
          echo "OAUTH_CLIENT_ID 已注入: ${OAUTH_ID:-<空>}"

      - name: 构建 OSS 包
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOssDebug --no-daemon

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-oss-debug
          path: apps/android/app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: warn

