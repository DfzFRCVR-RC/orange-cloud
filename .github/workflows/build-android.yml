name: Android OSS Release (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21 (JetBrains)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "jetbrains"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: 写入 local.properties（OAuth 客户端）
        working-directory: apps/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "OAUTH_CLIENT_ID=e835bf30a41b35df00333e74f35a6439" >> local.properties
          echo "OAUTH_CLIENT_ID 已注入:"
          grep OAUTH_CLIENT_ID local.properties

      - name: 临时替换 OAuthConfig 回调地址
        working-directory: apps/android
        run: |
          sed -i 's|const val REDIRECT_URI = "https://o-c.do/oauth/callback"|const val REDIRECT_URI = "https://oauth.miside.ccwu.cc/oauth/callback"|' \
            app/src/main/kotlin/jiamin/chen/orangecloud/core/auth/OAuthConfig.kt
          echo "=== 替换后的 REDIRECT_URI ==="
          grep REDIRECT_URI app/src/main/kotlin/jiamin/chen/orangecloud/core/auth/OAuthConfig.kt

      - name: 构建 OSS Release 包（未签名）
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOssRelease --no-daemon

      - name: 查找并列出所有 APK
        if: always()
        working-directory: apps/android
        run: |
          echo "=== 搜索所有 APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "没有找到 APK"

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-oss-release-unsigned
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error