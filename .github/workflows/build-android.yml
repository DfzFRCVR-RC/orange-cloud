name: Build Android OSS APK
on:
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: 'OAUTH_CLIENT_ID（OSS 自编译 OAuth Client）'
        required: true
        default: 'e835bf30a41b35df00333e74f35a6439'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Write local.properties (OAUTH_CLIENT_ID)
        working-directory: apps/android
        run: echo "OAUTH_CLIENT_ID=${{ inputs.oauth_client_id }}" > local.properties
      - name: Build OSS Debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleOssDebug --no-daemon
      - name: Upload OSS APK
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-apk
          path: apps/android/app/build/outputs/apk/oss/debug/*.apk
          retention-days: 7
