name: Build OSS APK

on:
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: "Cloudflare OAuth Client ID（自建）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-oss-apk.yml"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
  ANDROID_COMPILE_SDK: "36"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 不用 android-actions/setup-android：它会 sdkmanager "tools"，
      # 而新版 cmdline-tools 已移除该包，必然报 "Failed to find package 'tools'"。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set -eu
          # 用 printf 喂一串 y 而不是 `yes |`：sdkmanager 读够就退出，
          # `yes` 会收到 SIGPIPE 报 "Broken pipe"，配合 pipefail 会被误判为失败。
          printf 'y\n%.0s' $(seq 1 50) | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write local.properties
        env:
          OAUTH_CLIENT_ID: ${{ inputs.oauth_client_id || vars.OAUTH_CLIENT_ID }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$OAUTH_CLIENT_ID" ]; then
            printf 'OAUTH_CLIENT_ID=%s\n' "$OAUTH_CLIENT_ID" >> local.properties
          fi
          # 固定签名：同包名后续版本必须同签名才能覆盖安装
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
            {
              printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/apps/android/keystore/release.jks"
              printf 'storePassword=%s\n' "$KEYSTORE_PASS"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASS"
            } > keystore.properties
          fi

      - name: Build ossRelease
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew :app:assembleOssRelease --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          cd apps/android
          mkdir -p "$GITHUB_WORKSPACE/out"
          find app/build/outputs/apk -name "*.apk" -print
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            cp "$f" "$GITHUB_WORKSPACE/out/$(basename "$f")"
          done
          ls -lh "$GITHUB_WORKSPACE/out"
          APK=$(ls "$GITHUB_WORKSPACE"/out/*.apk | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA256: ${{ steps.collect.outputs.sha256 }}
          NOTES: |
            自编译全解锁版（oss 风味）
            回调中转：https://oc.miaowu.us.ci/oauth/callback
        run: |
          cd "$GITHUB_WORKSPACE/out"
          # 版本号从 build.gradle.kts 读，标题带上它 + 时间 + commit，方便区分多次构建
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GITHUB_WORKSPACE/apps/android/app/build.gradle.kts" | head -1)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          TAG="v${VER}-${STAMP}"
          TITLE="OrangeCloud-OSS-v${VER}-${STAMP}-${SHORT_SHA}"
          gh release create "$TAG" ./*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "$NOTES

          Commit: $SHORT_SHA
          SHA256: $SHA256"
          echo "### ✅ 已发布：$TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "下载：\`https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-oss-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
