name: Build OSS APK

on:
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: "Cloudflare OAuth Client ID（自建）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-oss-apk.yml"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
  ANDROID_COMPILE_SDK: "36"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" "build-tools;36.0.0" "platform-tools" | tail -5

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write local.properties
        env:
          OAUTH_CLIENT_ID: ${{ inputs.oauth_client_id || vars.OAUTH_CLIENT_ID }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$OAUTH_CLIENT_ID" ]; then
            printf 'OAUTH_CLIENT_ID=%s\n' "$OAUTH_CLIENT_ID" >> local.properties
          fi
          # 固定签名：同包名后续版本必须同签名才能覆盖安装
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
            {
              printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/apps/android/keystore/release.jks"
              printf 'storePassword=%s\n' "$KEYSTORE_PASS"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASS"
            } > keystore.properties
          fi

      - name: Build ossRelease
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew :app:assembleOssRelease --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          cd apps/android
          mkdir -p "$GITHUB_WORKSPACE/out"
          find app/build/outputs/apk -name "*.apk" -print
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            cp "$f" "$GITHUB_WORKSPACE/out/$(basename "$f")"
          done
          ls -lh "$GITHUB_WORKSPACE/out"
          APK=$(ls "$GITHUB_WORKSPACE"/out/*.apk | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA256: ${{ steps.collect.outputs.sha256 }}
          NOTES: |
            自编译全解锁版（oss 风味）
            回调中转：https://oc.miaowu.us.ci/oauth/callback
        run: |
          cd "$GITHUB_WORKSPACE/out"
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" ./*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Orange Cloud OSS $TAG" \
            --notes "$NOTES

          SHA256: $SHA256"
