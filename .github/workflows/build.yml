name: Build Orange Cloud APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Write local.properties
        run: echo "OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}" >> apps/android/local.properties
      - name: Build oss APK
        working-directory: apps/android
        run: ./gradlew :app:assembleOssDebug
      - uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss
          path: apps/android/app/build/outputs/apk/oss/debug/*.apk